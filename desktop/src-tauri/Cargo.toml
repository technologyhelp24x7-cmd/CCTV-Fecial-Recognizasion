[package]
name = "lumaflux-intelligence"
version = "0.1.0"
description = "LumaFlux Intelligence - Enterprise CCTV Video Intelligence & Analytics Desktop Platform"
authors = ["LumaFlux Engineering"]
edition = "2021"

[lib]
name = "lumaflux_intelligence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
