name: LumaFlux Intelligence Multi-OS Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  verify-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install -r backend/requirements.txt
      - name: Run frontend and backend verification suites
        run: |
          npm run build
          npm test
          python3 -m pytest -v tests

  package-desktop:
    needs: verify-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_label: windows-10-11-x64
            artifacts: |
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_label: macos-apple-silicon-arm64
            artifacts: |
              desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          - os: macos-13
            target: x86_64-apple-darwin
            platform_label: macos-intel-x64
            artifacts: |
              desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform_label: linux-x64
            artifacts: |
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform_label: linux-arm64
            artifacts: |
              desktop/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux webkit/gtk system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies & build SPA
        run: npm ci && npm run build
      - name: Build Tauri 2 Desktop Bundle (${{ matrix.platform_label }})
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}
      - name: Upload Desktop Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumaflux-${{ matrix.platform_label }}
          path: ${{ matrix.artifacts }}
